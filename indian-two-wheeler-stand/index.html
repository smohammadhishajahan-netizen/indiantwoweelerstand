<!DOCTYPE html>
<html lang="ta">

      <a class="icon-btn" href="#backup" title="Backup / அமைப்புகள்">⚙</a>
    </div>
  </div>
</header>

<div id="storageWarn" class="banner hidden"></div>

<main id="app">
  <section class="view" id="view-home"></section>
  <section class="view" id="view-cash"></section>
  <section class="view" id="view-phonepe"></section>

  <section class="view" id="view-weeks"></section>
  <section class="view" id="view-report"></section>

<nav class="bottomnav" aria-label="முதன்மை பட்டியல்">
  <a href="#home" data-nav="home"><span class="ni">🏠</span><span>முகப்பு</span></a>
  <a href="#cash" data-nav="entry"><span class="ni">➕</span><span>பதிவு</span></a>
  <a href="#weeks" data-nav="weeks"><span class="ni">📁</span><span>வாரம்</span></a>
  <a href="#report" data-nav="report"><span class="ni">📊</span><span>அறிக்கை</span></a>
  <a href="#history" data-nav="history"><span class="ni">🕘</span><span>வரலாறு</span></a>
</nav>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modal-card">
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
    <div id="modalBtns" class="modal-btns"></div>
  </div>
</div>
<div id="toast" class="toast hidden" role="status"></div>
<div id="printArea" class="print-only"></div>

<script src="export.js"></script>
<script src="app.js"></script>
